<svg xmlns="http://www.w3.org/2000/svg" width="680" height="552" viewBox="0 0 680 552" role="img">
<title>gtm-outbound package levels</title>
<desc>Four stacked tiers: the package layer that is never installed, the always-loaded orchestrator, eight sub-skills of which one loads per route, and the on-demand payload of references, scripts, templates and one agent.</desc>
<style>
text{font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.th{font-size:14px;font-weight:600}
.ts{font-size:12px;font-weight:400}
.lbl{font-size:12px;font-weight:400;fill:#5F5E5A}
.cont{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4}
.arr{stroke:#888780;stroke-width:1.2;fill:none}
.gr{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.gt{fill:#2C2C2A}.gs{fill:#5F5E5A}
.pr{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.pt{fill:#26215C}.ps{fill:#534AB7}
.tr{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.tt{fill:#04342C}.tsx{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="552" fill="#FFFFFF"/>

<rect class="cont" x="40" y="40" width="600" height="84" rx="8"/>
<text class="lbl" x="52" y="58">package — never installed</text>
<rect class="gr" x="56" y="68" width="130" height="44" rx="4"/><text class="th gt" x="121" y="84" text-anchor="middle" dominant-baseline="central">installers</text><text class="ts gs" x="121" y="99" text-anchor="middle" dominant-baseline="central">ps1 and sh</text>
<rect class="gr" x="202" y="68" width="130" height="44" rx="4"/><text class="th gt" x="267" y="84" text-anchor="middle" dominant-baseline="central">preflight.py</text><text class="ts gs" x="267" y="99" text-anchor="middle" dominant-baseline="central">runs 6 scripts</text>
<rect class="gr" x="348" y="68" width="130" height="44" rx="4"/><text class="th gt" x="413" y="84" text-anchor="middle" dominant-baseline="central">_evals/</text><text class="ts gs" x="413" y="99" text-anchor="middle" dominant-baseline="central">29 evals</text>
<rect class="gr" x="494" y="68" width="130" height="44" rx="4"/><text class="th gt" x="559" y="84" text-anchor="middle" dominant-baseline="central">HANDOFF.md</text><text class="ts gs" x="559" y="99" text-anchor="middle" dominant-baseline="central">decisions</text>

<rect class="cont" x="40" y="152" width="600" height="88" rx="8"/>
<text class="lbl" x="52" y="170">always in context</text>
<rect class="pr" x="210" y="180" width="260" height="48" rx="4"/><text class="th pt" x="340" y="198" text-anchor="middle" dominant-baseline="central">gtm-outbound/SKILL.md</text><text class="ts ps" x="340" y="214" text-anchor="middle" dominant-baseline="central">routes, gates, rules</text>

<line class="arr" x1="340" y1="242" x2="340" y2="266" marker-end="url(#arrow)"/>

<rect class="cont" x="40" y="268" width="600" height="148" rx="8"/>
<text class="lbl" x="52" y="286">one loads when routed to</text>
<rect class="pr" x="56" y="296" width="130" height="48" rx="4"/><text class="th pt" x="121" y="314" text-anchor="middle" dominant-baseline="central">offer</text><text class="ts ps" x="121" y="330" text-anchor="middle" dominant-baseline="central">ICP + value eq</text>
<rect class="pr" x="202" y="296" width="130" height="48" rx="4"/><text class="th pt" x="267" y="314" text-anchor="middle" dominant-baseline="central">list</text><text class="ts ps" x="267" y="330" text-anchor="middle" dominant-baseline="central">sourcing spec</text>
<rect class="pr" x="348" y="296" width="130" height="48" rx="4"/><text class="th pt" x="413" y="314" text-anchor="middle" dominant-baseline="central">clay</text><text class="ts ps" x="413" y="330" text-anchor="middle" dominant-baseline="central">table build</text>
<rect class="pr" x="494" y="296" width="130" height="48" rx="4"/><text class="th pt" x="559" y="314" text-anchor="middle" dominant-baseline="central">copy</text><text class="ts ps" x="559" y="330" text-anchor="middle" dominant-baseline="central">sequences</text>
<rect class="pr" x="56" y="356" width="130" height="48" rx="4"/><text class="th pt" x="121" y="374" text-anchor="middle" dominant-baseline="central">math</text><text class="ts ps" x="121" y="390" text-anchor="middle" dominant-baseline="central">sizing and CAC</text>
<rect class="pr" x="202" y="356" width="130" height="48" rx="4"/><text class="th pt" x="267" y="374" text-anchor="middle" dominant-baseline="central">score</text><text class="ts ps" x="267" y="390" text-anchor="middle" dominant-baseline="central">launch gate</text>
<rect class="pr" x="348" y="356" width="130" height="48" rx="4"/><text class="th pt" x="413" y="374" text-anchor="middle" dominant-baseline="central">diagnose</text><text class="ts ps" x="413" y="390" text-anchor="middle" dominant-baseline="central">post-launch</text>
<rect class="pr" x="494" y="356" width="130" height="48" rx="4"/><text class="th pt" x="559" y="374" text-anchor="middle" dominant-baseline="central">reply</text><text class="ts ps" x="559" y="390" text-anchor="middle" dominant-baseline="central">inbox triage</text>

<line class="arr" x1="340" y1="418" x2="340" y2="442" marker-end="url(#arrow)"/>

<rect class="cont" x="40" y="444" width="600" height="88" rx="8"/>
<text class="lbl" x="52" y="462">loaded only when named</text>
<rect class="tr" x="56" y="472" width="130" height="48" rx="4"/><text class="th tt" x="121" y="490" text-anchor="middle" dominant-baseline="central">references</text><text class="ts tsx" x="121" y="506" text-anchor="middle" dominant-baseline="central">21 files</text>
<rect class="tr" x="202" y="472" width="130" height="48" rx="4"/><text class="th tt" x="267" y="490" text-anchor="middle" dominant-baseline="central">scripts</text><text class="ts tsx" x="267" y="506" text-anchor="middle" dominant-baseline="central">6 deterministic</text>
<rect class="tr" x="348" y="472" width="130" height="48" rx="4"/><text class="th tt" x="413" y="490" text-anchor="middle" dominant-baseline="central">templates</text><text class="ts tsx" x="413" y="506" text-anchor="middle" dominant-baseline="central">8 shapes</text>
<rect class="tr" x="494" y="472" width="130" height="48" rx="4"/><text class="th tt" x="559" y="490" text-anchor="middle" dominant-baseline="central">agent</text><text class="ts tsx" x="559" y="506" text-anchor="middle" dominant-baseline="central">1 fan-out</text>
</svg>
